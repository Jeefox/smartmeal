name: smartmeal-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartmeal_test
      POSTGRES_USER: smartmeal
      POSTGRES_PASSWORD: smartmeal-test-local
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmeal -d smartmeal_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  object-storage:
    image: chrislusf/seaweedfs:4.41
    environment:
      AWS_ACCESS_KEY_ID: smartmeal-test
      AWS_SECRET_ACCESS_KEY: smartmeal-test-secret
      S3_BUCKET: smartmeal-test-recipes
    ports:
      - "127.0.0.1:59001:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 15
