name: smartmeal

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartmeal
      POSTGRES_USER: smartmeal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmeal -d smartmeal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  object-storage:
    image: chrislusf/seaweedfs:4.41
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-smartmeal}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-smartmeal-dev-secret-change-me}
      S3_BUCKET: ${S3_BUCKET:-smartmeal-recipes}
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  object_storage_data:
