# Verified Spring Security default logout endpoint.
location = /logout {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Пример для уже настроенного HTTPS virtual host. Укажите реальный путь сборки.
# Backend должен оставаться доступным только из доверенной сети сервера.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /sw.js {
    root /var/www/smartmeal;
    add_header Cache-Control "no-cache";
}
location / {
    root /var/www/smartmeal;
    try_files $uri $uri/ /index.html;
}
