# Start with --spring.profiles.active=prod behind the HTTPS reverse proxy.
server.address=127.0.0.1
server.servlet.session.cookie.secure=true
smartmeal.storage.access-key=${S3_ACCESS_KEY}
smartmeal.storage.secret-key=${S3_SECRET_KEY}
# Only loopback proxy traffic may supply the real client address.
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# Keep request payloads, authentication diagnostics and JDBC bind values out of production logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
