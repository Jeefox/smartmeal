spring.application.name=smartmeal

spring.datasource.url=jdbc:postgresql://localhost:5433/smartmeal
spring.datasource.username=smartmeal
spring.config.import=optional:file:.env[.properties]
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
# Include multipart boundaries and form fields in addition to the 10 MB image.
spring.servlet.multipart.max-request-size=11MB

smartmeal.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
smartmeal.storage.access-key=${S3_ACCESS_KEY:smartmeal}
smartmeal.storage.secret-key=${S3_SECRET_KEY:smartmeal-dev-secret-change-me}
smartmeal.storage.bucket=${S3_BUCKET:smartmeal-recipes}

# The proxy terminates public HTTPS; the backend remains loopback-only.
server.address=127.0.0.1
server.forward-headers-strategy=NONE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
smartmeal.security.catalogue-editor-ids=${SMARTMEAL_CATALOGUE_EDITOR_IDS:}
smartmeal.security.auth-requests-per-minute=20
smartmeal.security.writes-per-minute=120
